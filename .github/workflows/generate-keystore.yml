name: Generate Release Keystore

# 一度だけ手動実行する。生成されたkeystoreはartifactでダウンロードし、
# GitHub Secrets に登録する(以下4つのSecretsが必要):
#   ANDROID_KEYSTORE_BASE64  : artifactの keystore.base64 の中身そのまま
#   KEYSTORE_PASSWORD        : 下記入力のキーストアパスワード
#   KEY_ALIAS                : 下記入力の鍵エイリアス
#   KEY_PASSWORD             : 下記入力の鍵パスワード(同じでも可)
#
# 一度生成したらこのワークフローは不要(削除してもよい)。鍵を再生成すると
# 既存のGoogle Play配信アプリの更新ができなくなるので絶対に再生成しないこと。

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password (8文字以上、英数記号)'
        required: true
        type: string
      key_alias:
        description: 'Key alias (例: yanotou)'
        required: true
        default: 'yanotou'
        type: string
      key_password:
        description: 'Key password (keystore_passwordと同じでOK)'
        required: true
        type: string
      cn_name:
        description: '証明書のCN(名前、英数で。例: Morohara)'
        required: true
        default: 'Morohara'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ inputs.keystore_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=${{ inputs.cn_name }}, OU=YaNoTou, O=Personal, L=Tokyo, ST=Tokyo, C=JP"
          base64 -w 0 release.keystore > keystore.base64
          echo "Done."
          ls -la release.keystore keystore.base64
      - name: Upload keystore (base64 + binary)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            keystore.base64
          retention-days: 1
